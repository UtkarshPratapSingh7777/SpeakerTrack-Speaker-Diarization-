
seed: 42

audio:
  target_sample_rate: 16000
  mono: true
  peak_normalize: true
  min_duration_seconds: 0.5

features:
  n_mels: 80
  n_fft: 400
  win_length_ms: 25.0
  hop_length_ms: 10.0
  f_min: 20.0
  f_max: 7600.0

vad:
  backend: silero
  threshold: 0.5
  min_speech_duration_ms: 250
  min_silence_duration_ms: 100
  speech_pad_ms: 100
  window_size_samples: 512
  energy_fallback:
    frame_length_ms: 25.0
    hop_length_ms: 10.0
    energy_threshold_db: -40.0
    zcr_threshold: 0.5

embedding:
  backend: speechbrain
  pretrained_source: "speechbrain/spkrec-ecapa-voxceleb"
  checkpoint_path: null
  cache_dir: ".cache/ecapa_tdnn"
  channels: 512
  embedding_dim: 192
  res2net_scale: 8
  se_bottleneck: 128
  attention_channels: 128
  device: auto
  batch_size: 32
  window_duration_s: 1.5
  window_step_s: 0.75
  min_window_duration_s: 0.5

clustering:
  method: agglomerative
  metric: cosine
  distance_threshold: 0.45
  linkage: average
  min_speakers: 1
  max_speakers: 8
  auto_estimate_speakers: true
  smoothing:
    min_segment_duration_s: 0.5
    collar_s: 0.25

output:
  format: rttm
  output_dir: outputs

logging:
  level: INFO
  log_to_file: false
  log_file_path: logs/pipeline.log
  json_format: false
